name: Release

# Runs when the maintainer pushes a version tag (for example v1.0.0).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build distributions and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Build sdist and wheel
        run: uv build
      - name: CycloneDX SBOM
        run: uv run cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pulseboard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  image:
    name: Build and smoke-test the Profile A image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: Build (linux/amd64)
        run: docker buildx build --platform linux/amd64 -f deploy/Dockerfile -t pulseboard:smoke --load .
      - name: Smoke test
        run: uv run python scripts/image_smoke.py --image pulseboard:smoke
      - name: Save image
        run: docker save pulseboard:smoke | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz

  image-publish:
    name: Push the image to GHCR
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/sunishbharat/pulseboard
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Push (exact version; latest only on full releases; never overwrite)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "not a semantic version tag: $TAG" >&2; exit 1; }
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version already exists; refusing to overwrite" >&2
            exit 1
          fi
          gunzip -c image.tar.gz | docker load
          docker tag pulseboard:smoke "$IMAGE:$version"
          docker push "$IMAGE:$version"
          case "$version" in
            *-*) echo "pre-release: latest not moved" ;;
            *) docker tag pulseboard:smoke "$IMAGE:latest" && docker push "$IMAGE:latest" ;;
          esac
